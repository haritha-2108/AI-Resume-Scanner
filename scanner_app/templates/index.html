<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Resume Scanner</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f8f9fa; }
    .upload-card {
      max-width: 600px;
      margin: 80px auto;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      background: white;
    }
    .btn-upload {
      border-radius: 30px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="upload-card">
    <h2 class="text-center mb-4 text-primary">AI Resume Scanner</h2>
    <p class="text-muted text-center mb-4">Upload a resume and job description to see how well they match</p>
    
    <form method="POST" enctype="multipart/form-data">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label fw-bold">Candidate Name</label>
        <input type="text" name="name" class="form-control" placeholder="Enter candidate name" required>
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold">Upload Resume (PDF/DOCX)</label>
        <input type="file" name="resume" class="form-control" accept=".pdf,.docx" required>
      </div>
      <div class="mb-3">
        <label class="form-label fw-bold">Job Description</label>
        <textarea name="job_description" rows="6" class="form-control" placeholder="Paste job description here..." required></textarea>
      </div>
      <button type="submit" class="btn btn-primary btn-upload w-100 py-2">🚀 Scan Resume</button>
    </form>
  </div>
</body>
</html>
